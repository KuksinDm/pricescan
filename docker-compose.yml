  nginx_pricescan:
    build:
      context: ./nginx/
      dockerfile: Dockerfile
    image: myzos/nginx_pricescan:latest
    volumes:
        - staticfiles_pricescan:/var/html/static
        - media_data_pricescan:/app/media 
    ports:
      - "9040:80"
    depends_on:
      - web_pricescan
    restart: always
    networks:
      - app_network


volumes:
  postgres_data_pricescan:
  staticfiles_pricescan:
  media_data_pricescan:
  redis_data:

networks:
  app_network:
    driver: bridge 
