[project]
name = "pricescan-parser"
version = "0.1.0"
description = "PriceScan Parser Service"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pydantic>=2.8",
  "fastapi>=0.116.2",
  "uvicorn>=0.35.0",
  "loguru>=0.7.0",
  "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]